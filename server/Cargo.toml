[package]
name = "webshooter"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
description = "Webshooter server"

[features]
debug = []

[target.'cfg(target_os = "linux")'.dependencies]
inputtino = { workspace = true }

[dependencies]
ashpd = { workspace = true, features = [
    "pipewire",
    "remote_desktop",
    "screencast",
] }
rust-embed = { workspace = true, features = ["poem", "mime-guess"] }
anyhow.workspace = true
bitflags.workspace = true
libc.workspace = true
async-channel.workspace = true
bytes = { workspace = true, features = ["serde"] }
ecdsa = { workspace = true, features = ["spki"] }
futures-util.workspace = true
data-encoding.workspace = true
http.workspace = true
mime_guess.workspace = true
notify.workspace = true
p384.workspace = true
poem = { workspace = true, features = [
    "rustls",
    "tokio-rustls",
    "static-files",
] }
rand.workspace = true
ssl_controller.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
json5.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "fs",
] }
toml.workspace = true
ts-rs.workspace = true
upon.workspace = true
wtransport.workspace = true
x509-parser.workspace = true
pipewire.workspace = true
shared.workspace = true
macros.workspace = true
tokio-util.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-video.workspace = true
reis = { workspace = true, features = ["tokio"] }
log.workspace = true
ksni = { version = "0.3.6", features = ["tokio"] }
resvg = { version = "0.48.1", default-features = false }
moq-net.workspace = true
quinn.workspace = true
web-transport-trait.workspace = true
