[package]
name = "webshooter-wasm"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Wasm client for webshooter"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "MediaQueryList",
    "AddEventListenerOptions",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "HtmlElement",
    "Element",
    "Navigator",
    "Location",
    "MediaSource",
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "VideoFrame",
    "AudioContext",
    "AudioContextState",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AnalyserNode",
    "AudioData",
    "AudioDataCopyToOptions",
    "AudioSampleFormat",
    "AudioDecoder",
    "AudioDecoderConfig",
    "AudioDecoderInit",
    "EncodedAudioChunk",
    "EncodedAudioChunkInit",
    "EncodedAudioChunkType",
    "AudioNode",
    "AudioDestinationNode",
    "GainNode",
    "AudioParam",
    "BaseAudioContext",
    "WebTransport",
    "WebTransportOptions",
    "WebTransportDatagramDuplexStream",
    "WebTransportBidirectionalStream",
    "WebTransportSendStream",
    "WebTransportReceiveStream",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "Performance",
    "ResizeObserver",
    "TouchEvent",
    "Touch",
    "TouchList",
    "KeyboardEvent",
    "PointerEvent",
    "Gamepad",
    "GamepadButton",
    "DeviceMotionEvent",
    "DeviceAcceleration",
    "DeviceRotationRate",
    "MouseEvent",
    "WheelEvent",
    "console",
    "Request",
    "Response",
    "RequestInit",
    "Headers",
    "CloseEvent",
    "WebTransportCloseInfo",
    "Storage",
    "DomRect",
    "DomRectReadOnly",
    "HtmlButtonElement",
    "HtmlDivElement",
    "HtmlSpanElement",
    "Text",
] }
shared.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
bytes.workspace = true
moq-net.workspace = true

# `moq-net` reaches `getrandom`, which does not build for `wasm32-unknown-unknown`
# until a backend is named. It is chosen here rather than by naming the backend in
# rustflags because an environment `RUSTFLAGS` (which a wasm-pack invocation may
# set) replaces the config's flags wholesale, and this way the choice travels with
# the manifest. Under `target_family = "wasm"` only, so nothing native links it.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
