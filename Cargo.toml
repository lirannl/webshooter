[workspace]
resolver = "2"
members = ["macros", "server", "shared", "webui/wasm"]
default-members = ["server"]

[workspace.package]
edition = "2024"
version = "0.8.0"
repository = "https://github.com/lirannl/webshooter"
license = "LICENSE"

[workspace.dependencies]
shared = { path = "shared", package = "webshooter-shared" }
macros = { path = "macros", package = "webshooter-macros" }

anyhow = "1"
ashpd = "0.13"
async-channel = "2.5"
bitflags = "2"
bytes = "1.12"
data-encoding = "2.11"
ecdsa = "0.17"
futures-util = "0.3"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
http = "1.5"
indexmap = "2"
js-sys = "0.3"
libc = "0.2"
mime_guess = "2.0"
notify = "8.2"
p384 = "0.14"
pipewire = "^0.9"
poem = "3.1"
rand = "0.10"
ssl_controller = { git = "https://github.com/lirannl/ssl_controller.git", rev = "af26514", features = ["serde"] }
regex = "1.13"
reis = "0.7"
reqwest = "0.13"
x509-parser = "0.18"
inputtino = { git = "https://github.com/games-on-whales/inputtino", rev = "b887f6a" }
rust-embed = "8"
rustls = "0.23"
serde = "1.0"
# Reads configs. A strict superset of JSON, so it also covers `.jsonc`.
json5 = "1.3"
serde_json = "1.0"
serde_yaml = "0.9"
serde-wasm-bindgen = "0.6"
thiserror = "2"
tokio = "1.53"
tokio-util = "0.7"
toml = "1"
ts-rs = "12.0"
upon = "0.11"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
# The `quinn` feature exposes the inner quinn::Connection, which is the only way
# to read the path counters (MTU, lost packets, black holes) and the datagram
# send-buffer space. Both decide whether a frame can go out as a datagram
# without being lost, so neither is optional here.
wtransport = { version = "0.7", features = ["quinn"] }
named_constants = { git = "https://github.com/lirannl/named_constants", rev = "16bbad860fe868ec63030ae1ece0fa7bab341f42" }
log = { version = "0.4.34", features = [ "serde", "alloc" ] }
moq-net = "0.3.8"
# Reached through `wtransport`, whose `quinn` feature re-exports these types, but
# named directly: the poll-based MoQ adapter drives stream I/O through quinn's
# poll API (see `server/src/moq/transport.rs`).
quinn = "0.11"
web-transport-trait = "0.4"
